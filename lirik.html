<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist - By Dexy</title>
    <link rel="stylesheet" href="/styles/style.css">

    <!-- CDN Vanta.js & Three.js untuk Background Animasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
</head>

<body>
    <div class="music-container">
        <!-- Kolom Kiri: Cover & Player -->
        <div class="left-column">
            <div class="album-art-container">
                <img src="/icon_music/perfect.svg" alt="Album Cover" id="album-cover">
            </div>
            <div class="song-info">
                <h1 class="song-title">Perfect</h1>
                <p class="artist-name">Ed Sheeran</p>
            </div>

            <!-- Audio Player Minimalis -->
            <audio id="audio-player" src="/asset_music/perfect.mp3"></audio>

            <div class="player-controls">
                <span id="current-time">0:00</span>
                <div class="progress-bar-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar">
                        <!-- Tambahkan thumb (bola kecil) di ujung progress bar -->
                        <div class="progress-thumb" id="progress-thumb"></div>
                    </div>
                    <!-- Tambahkan tooltip penunjuk waktu -->
                    <div class="time-tooltip" id="time-tooltip">0:00</div>
                </div>
                <span id="duration">3:50</span>
            </div>

            <div class="playback-controls">
                <button id="shuffle-btn" class="control-btn" aria-label="Acak">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M10.59,9.17L5.41,4L4,5.41L9.17,10.58L10.59,9.17M14.5,4L18.06,7.55L4,21.59L5.41,23L19.46,8.95L23,12.5V4H14.5M14.83,13.41L13.41,14.82L16.59,18L13.41,21.17L14.83,22.58L18,19.41L21.17,22.58L22.58,21.17L19.41,18L22.58,14.83L21.17,13.41L18,16.58L14.83,13.41Z" />
                    </svg>
                </button>
                <button id="prev-btn" class="control-btn" aria-label="Sebelumnya">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" />
                    </svg>
                </button>
                <button id="play-pause-btn" class="control-btn play-btn">
                    <svg id="play-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                    </svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;">
                        <path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z" />
                    </svg>
                </button>
                <button id="next-btn" class="control-btn" aria-label="Selanjutnya">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" />
                    </svg>
                </button>
                <button id="repeat-btn" class="control-btn" aria-label="Ulangi">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor"
                            d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Kolom Kanan: Synced Lyrics (Apple Music Style) -->

        <div class="right-column">
            <div class="lyrics-wrapper" id="lyrics-container">
                <!-- Lirik akan di-generate otomatis oleh JavaScript dari file .lrc -->
            </div>
        </div>

        <!-- Tombol Back: child langsung .music-container agar tidak ikut scroll .right-column -->
        <button id="back-to-player" class="back-btn" aria-label="Kembali">‹</button>
    </div>

    <a href="/index.html" class="home-btn" aria-label="Kembali ke beranda">⬅</a>

    <script src="/scripts/songs-data.js"></script>
    <script src="/scripts/script.js"></script>
</body>

</html>
